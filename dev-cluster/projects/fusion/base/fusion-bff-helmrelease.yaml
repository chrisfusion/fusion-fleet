apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fusion-bff
spec:
  interval: 1m
  releaseName: fusion-bff
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./deployment
      sourceRef:
        kind: GitRepository
        name: fusion-bff-main
        namespace: flux-system
      valuesFiles:
        - deployment/values.yaml
  values:
    image:
      repository: fusion-bff
      tag: "0.4.7"
      pullPolicy: Never
    config:
      oidcBypass: true
    db:
      create: true
