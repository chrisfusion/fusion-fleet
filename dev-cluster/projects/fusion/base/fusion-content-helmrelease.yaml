apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fusion-content
spec:
  interval: 1m
  releaseName: fusion-content
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./deployment
      sourceRef:
        kind: GitRepository
        name: fusion-content-main
        namespace: flux-system
      valuesFiles:
        - deployment/values.yaml
  values:
    repos:
      sources:
        - name: fusion-forge
          url: https://github.com/chrisfusion/fusion-forge
          changelogPath: CHANGELOG.md
        - name: fusion-index
          url: https://github.com/chrisfusion/fusion-index
          changelogPath: CHANGELOG.md
        - name: fusion-spectra
          url: https://github.com/chrisfusion/fusion-spectra
          changelogPath: CHANGELOG.md
        - name: fusion-bff
          url: https://github.com/chrisfusion/fusion-bff
          changelogPath: CHANGELOG.md
