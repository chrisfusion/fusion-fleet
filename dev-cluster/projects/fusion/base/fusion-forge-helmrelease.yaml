apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fusion-forge
spec:
  interval: 1m
  releaseName: fusion-forge
  # Helm never upgrades a chart's crds/ — Flux creates/replaces them on every install/upgrade.
  # CRDs are cluster-scoped: if an instance on an older ref joins this cluster, give it
  # `crds: Skip` in its patch so it doesn't roll the CRDs back.
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: ./deployment
      sourceRef:
        kind: GitRepository
        name: fusion-forge-main
        namespace: flux-system
      valuesFiles:
        - deployment/values.yaml
