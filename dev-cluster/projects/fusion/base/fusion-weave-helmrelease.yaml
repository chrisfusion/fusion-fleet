apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fusion-weave
spec:
  interval: 1m
  releaseName: fusion-weave
  # Helm never upgrades a chart's crds/ — Flux creates/replaces them on every install/upgrade.
  # CRDs are cluster-scoped: if an instance on an older ref joins this cluster, give it
  # `crds: Skip` in its patch so it doesn't roll the CRDs back.
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: ./deployment/fusion-weave
      sourceRef:
        kind: GitRepository
        name: fusion-weave-main
        namespace: flux-system
      valuesFiles:
        - deployment/fusion-weave/values.yaml
  values:
    namespaceCreate: false
    image:
      repository: fusion-weave-operator
      tag: "0.3.0"
      pullPolicy: Never
    api:
      image:
        repository: fusion-weave-operator
        tag: "0.3.0"
        pullPolicy: Never
      monitoring:
        enabled: true
