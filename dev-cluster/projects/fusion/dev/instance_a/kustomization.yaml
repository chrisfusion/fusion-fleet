apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fusion-dev-a
resources:
  - namespace.yaml
  - ../../base
  - jobs
patches:
  - path: fusion-bff-helmrelease-patch.yaml
    target:
      kind: HelmRelease
      name: fusion-bff
  - path: fusion-forge-helmrelease-patch.yaml
    target:
      kind: HelmRelease
      name: fusion-forge
  - path: fusion-weave-helmrelease-patch.yaml
    target:
      kind: HelmRelease
      name: fusion-weave
