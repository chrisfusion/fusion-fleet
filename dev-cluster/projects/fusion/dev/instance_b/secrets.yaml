# Credentials of this instance's dev Postgres (postgres-deployment.yaml). Same name and
# `password` key the old Bitnami subchart of fusion-index used, so fusion-bff's
# createDatabaseJob (postgresql.external.existingSecret) keeps working unchanged.
# Dev-only password — never reuse it anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: fusion-index-postgresql
type: Opaque
stringData:
  username: fusion
  password: devpass
